name: Apex tests

# Validate-only deploy of force-app to the Salesforce org + run the Apex tests.
# A validate deploy compiles and tests everything, then rolls back: nothing is saved in the org.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One validation at a time against the shared org.
concurrency:
  group: apex-tests
  cancel-in-progress: false

env:
  SF_CLI_VERSION: 2.157.8
  TEST_CLASSES: N8nAgentChatControllerTest
  MIN_COVERAGE: 90

jobs:
  validate:
    name: Validate deploy and run Apex tests
    # Secrets are not available to pull requests from forks: only run for branches of this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@${SF_CLI_VERSION} && sf --version

      - name: Authenticate (JWT bearer flow)
        env:
          SF_CI_CLIENT_ID: ${{ secrets.SF_CI_CLIENT_ID }}
          SF_CI_USERNAME: ${{ secrets.SF_CI_USERNAME }}
          SF_CI_JWT_KEY: ${{ secrets.SF_CI_JWT_KEY }}
        run: |
          key_file="$RUNNER_TEMP/server.key"
          printf '%s\n' "$SF_CI_JWT_KEY" > "$key_file"
          chmod 600 "$key_file"
          sf org login jwt \
            --client-id "$SF_CI_CLIENT_ID" \
            --jwt-key-file "$key_file" \
            --username "$SF_CI_USERNAME" \
            --instance-url https://login.salesforce.com \
            --alias ci
          rm -f "$key_file"

      - name: Validate deploy and run Apex tests
        run: |
          mkdir -p test-results
          set +e
          sf project deploy validate \
            --source-dir force-app \
            --target-org ci \
            --test-level RunSpecifiedTests \
            --tests ${TEST_CLASSES} \
            --junit \
            --coverage-formatters json-summary \
            --results-dir test-results \
            --wait 30 \
            --json > test-results/deploy-result.json
          status=$?
          set -e
          jq -r '.result | "Status: \(.status) | tests run: \(.details.runTestResult.numTestsRun // 0) | failures: \(.details.runTestResult.numFailures // 0)"' test-results/deploy-result.json || true
          if [ $status -ne 0 ]; then
            jq -r '.message // empty' test-results/deploy-result.json
            exit $status
          fi

      - name: Check coverage (>= ${{ env.MIN_COVERAGE }}% per class)
        run: |
          jq -r '.result.details.runTestResult.codeCoverage
                 | (if type == "array" then . else [.] end)[]
                 | "\(.name) \(((.numLocations | tonumber) - (.numLocationsNotCovered | tonumber)) * 100 / (.numLocations | tonumber))"' \
             test-results/deploy-result.json > coverage.txt
          cat coverage.txt
          {
            echo "### Apex coverage"
            echo "| Class | Coverage |"
            echo "|---|---|"
            awk '{ printf "| %s | %.1f%% |\n", $1, $2 }' coverage.txt
          } >> "$GITHUB_STEP_SUMMARY"
          awk -v min="$MIN_COVERAGE" '$2 < min { printf "::error::%s coverage %.1f%% is below %s%%\n", $1, $2, min; bad = 1 } END { exit bad }' coverage.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-test-results
          path: |
            test-results/
            !test-results/deploy-result.json
          if-no-files-found: ignore

      - name: Log out
        if: always()
        run: sf org logout --target-org ci --no-prompt || true
